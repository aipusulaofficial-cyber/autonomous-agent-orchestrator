apiVersion: v1
kind: Namespace
metadata: {name: ai-platform}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: autonomous-agent-orchestrator, namespace: ai-platform}
spec:
  replicas: 2
  selector: {matchLabels: {app: autonomous-agent-orchestrator}}
  template:
    metadata: {labels: {app: autonomous-agent-orchestrator}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: autonomous-agent-orchestrator:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}}
